name: Fingerprint April 2022 candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fingerprint-april-2022-candidates.yml']

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        build:
          - date: '2022-04-28T06-50-43Z'
            build_id: '8628560'
            manifest: '7515621376213891010'
          - date: '2022-04-21T06-50-40Z'
            build_id: '8567561'
            manifest: '3357294209222359997'
    steps:
      - name: Hash critical files
        shell: bash
        run: |
          set -euo pipefail
          base="https://archive.recagain.site/${{ matrix.build.date }}"
          mkdir -p files/RecRoom_Data/il2cpp_data/Metadata
          for f in RecRoom.exe Recroom_Release.exe GameAssembly.dll UnityPlayer.dll; do
            curl -fsSL --retry 3 --max-time 240 "$base/$f" -o "files/$f"
          done
          curl -fsSL --retry 3 --max-time 120 "$base/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat" -o files/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          paths={
            'recRoomExe':'RecRoom.exe','releaseExe':'Recroom_Release.exe','gameAssembly':'GameAssembly.dll',
            'unityPlayer':'UnityPlayer.dll','globalMetadata':'RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat'}
          out={'buildId':'${{ matrix.build.build_id }}','manifestId':'${{ matrix.build.manifest }}','depotId':'471711','buildDate':'${{ matrix.build.date }}','criticalFiles':{}}
          canonical=[]
          for label,rel in paths.items():
            p=Path('files')/rel; b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
            out['criticalFiles'][label]={'path':rel,'size':len(b),'sha256':h}; canonical.append(f'{rel}\0{len(b)}\0{h}')
          out['fileCount']=len(paths); out['totalBytes']=sum(v['size'] for v in out['criticalFiles'].values())
          out['fingerprintSha256']=hashlib.sha256('\n'.join(canonical).encode()).hexdigest()
          print('FINGERPRINT_JSON='+json.dumps(out,separators=(',',':')))
          print(json.dumps(out,indent=2))
          PY
