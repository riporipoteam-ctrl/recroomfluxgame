name: Fingerprint April 2022 candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fingerprint-april-2022-candidates.yml']

permissions:
  contents: write

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hash both April candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 - <<'PY' > diagnostics/april-2022-fingerprints.json
          import urllib.request,hashlib,json
          builds=[
            ('2022-04-28T06-50-43Z','8628560','7515621376213891010'),
            ('2022-04-21T06-50-40Z','8567561','3357294209222359997'),
          ]
          paths={
            'RecRoom.exe':'RecRoom.exe',
            'Recroom_Release.exe':'Recroom_Release.exe',
            'GameAssembly.dll':'GameAssembly.dll',
            'UnityPlayer.dll':'UnityPlayer.dll',
            'global-metadata.dat':'RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat',
          }
          results=[]
          for date,bid,manifest in builds:
            out={'schema':1,'buildId':bid,'manifestId':manifest,'depotId':'471711','buildDate':date,'fingerprintScope':'criticalFiles','criticalFiles':{}}
            canonical=[]
            for label,rel in paths.items():
              b=urllib.request.urlopen(f'https://archive.recagain.site/{date}/{rel}',timeout=240).read()
              h=hashlib.sha256(b).hexdigest(); n=len(b)
              out['criticalFiles'][label]={'path':rel,'size':n,'sha256':h}
              canonical.append(f'{rel}\0{n}\0{h}')
            out['fileCount']=len(paths)
            out['totalBytes']=sum(v['size'] for v in out['criticalFiles'].values())
            out['fingerprintSha256']=hashlib.sha256('\n'.join(canonical).encode()).hexdigest()
            results.append(out)
          print(json.dumps(results,indent=2))
          PY
          cat diagnostics/april-2022-fingerprints.json
      - name: Commit fingerprints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/april-2022-fingerprints.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record April 2022 Rec Room fingerprints'
          git pull --rebase origin main
          git push
