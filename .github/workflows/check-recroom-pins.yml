name: Check Rec Room SPKI pins

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-recroom-pins.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact May 19 2022 GameAssembly
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 300 'https://archive.recagain.site/2022-05-19T06-50-09Z/GameAssembly.dll' -o GameAssembly.dll
          echo '2ba4571be2791602386bf02581805e021568ccfeacce6cd265450974b7ea8f27  GameAssembly.dll' | sha256sum -c -

      - name: Extract embedded SPKI pins
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pefile
          python3 - <<'PY'
          import pefile
          pe=pefile.PE('GameAssembly.dll')
          base=pe.OPTIONAL_HEADER.ImageBase
          for i,va in enumerate((0x18773f848,0x187740e98),1):
              rva=va-base
              off=pe.get_offset_from_rva(rva)
              raw=pe.__data__[off:off+32]
              print(f'PIN{i}_HEX={raw.hex()}')
              import base64
              print(f'PIN{i}_B64={base64.b64encode(raw).decode()}')
          PY

      - name: Inspect live ns.rec.net TLS chain and SPKI hashes
        shell: bash
        run: |
          set -euo pipefail
          rm -f cert-*.pem chain.pem
          timeout 20 openssl s_client -connect ns.rec.net:443 -servername ns.rec.net -showcerts </dev/null 2>/tmp/sclient.err > /tmp/sclient.out || true
          cat /tmp/sclient.err || true
          awk '/BEGIN CERTIFICATE/{n++; f=sprintf("cert-%02d.pem",n)} f{print > f} /END CERTIFICATE/{close(f); f=""}' /tmp/sclient.out
          count=0
          for c in cert-*.pem; do
            [ -f "$c" ] || continue
            count=$((count+1))
            echo "===== $c ====="
            openssl x509 -in "$c" -noout -subject -issuer -dates -fingerprint -sha256
            openssl x509 -in "$c" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | openssl dgst -sha256 -binary | base64 | sed 's/^/SPKI_SHA256_B64=/'
            openssl x509 -in "$c" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | openssl dgst -sha256 | sed 's/^.*= /SPKI_SHA256_HEX=/'
          done
          echo "CHAIN_CERT_COUNT=$count"

      - name: Probe live nameserver response
        shell: bash
        run: |
          set -euo pipefail
          curl -vk --max-time 15 'https://ns.rec.net/?v=2' -o /tmp/ns.body 2>/tmp/ns.curl || true
          cat /tmp/ns.curl | tail -80
          echo '===== BODY ====='
          head -c 4000 /tmp/ns.body || true
          echo
