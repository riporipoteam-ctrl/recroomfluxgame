name: Check Rec Room SPKI pins

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-recroom-pins.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PIN1: a7461e4bd2d01f98d5ff780d6eb6b2662384d38cbc4c50835d8977a3e90f13e0
      PIN2: cb80e833e6da1db731cfd19041d739b3a8fbb1da89a96bd46246b80e8ffa0053
    steps:
      - name: Compare reachable Rec Room TLS chains with May 2022 pins
        shell: bash
        run: |
          set -euo pipefail
          total_matches=0
          for host in rec.net accounts.rec.net auth.rec.net rooms.rec.net api.rec.net ns.rec.net; do
            echo "========== HOST $host =========="
            rm -f cert-*.pem /tmp/sclient.out /tmp/sclient.err
            timeout 12 openssl s_client -connect "$host:443" -servername "$host" -showcerts </dev/null 2>/tmp/sclient.err > /tmp/sclient.out || true
            tail -20 /tmp/sclient.err || true
            awk '/BEGIN CERTIFICATE/{n++; f=sprintf("cert-%02d.pem",n)} f{print > f} /END CERTIFICATE/{close(f); f=""}' /tmp/sclient.out
            count=0
            for c in cert-*.pem; do
              [ -f "$c" ] || continue
              count=$((count+1))
              echo "===== $host $c ====="
              openssl x509 -in "$c" -noout -subject -issuer -dates || true
              hex=$(openssl x509 -in "$c" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | awk '{print $1}')
              echo "SPKI_HEX=$hex"
              if [ "$hex" = "$PIN1" ] || [ "$hex" = "$PIN2" ]; then
                echo '*** PIN MATCH ***'
                total_matches=$((total_matches+1))
              fi
            done
            echo "CHAIN_CERT_COUNT=$count"
          done
          echo "TOTAL_PIN_MATCHES=$total_matches"
