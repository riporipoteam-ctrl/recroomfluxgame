name: Live Aug 25 2021 Rec Room E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/live-aug25-2021-e2e.yml']

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space
      FIREBASE_API_KEY: AIzaSyBV_ev8AVpKwgioPSSWiBYf8UU09bLbWOU
    steps:
      - uses: actions/checkout@v4
      - name: Launch exact Aug 25 2021 client through existing broker label
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics /tmp/rr2021
          SESSION_ID=''; ACCESS_TOKEN=''; FIREBASE_TOKEN=''; PHASE='capability'; RESULT='failure'; ERROR=''
          cleanup() {
            set +e
            if [ -n "$SESSION_ID" ] && [ -n "$ACCESS_TOKEN" ]; then
              curl -sS --max-time 20 -X POST "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/release?accessToken=$ACCESS_TOKEN" >/tmp/rr2021/release.json || true
            fi
            if [ -n "$FIREBASE_TOKEN" ]; then
              curl -sS --max-time 20 -X POST "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$FIREBASE_API_KEY" -H 'content-type: application/json' --data "$(jq -cn --arg t "$FIREBASE_TOKEN" '{idToken:$t}')" >/tmp/rr2021/delete.json || true
            fi
            python3 - <<'PY'
          import json, pathlib, os
          def load(path):
              try: return json.loads(pathlib.Path(path).read_text())
              except Exception: return None
          out={
            'result':os.environ.get('RESULT','failure'),
            'phase':os.environ.get('PHASE','unknown'),
            'error':os.environ.get('ERROR',''),
            'targetBuild':'7225744',
            'targetManifest':'7611535694620830622',
            'brokerBuildId':'recroom-2022-05-19',
            'capability':load('/tmp/rr2021/capability.json'),
            'sessionCreate':load('/tmp/rr2021/create.json'),
            'sessionStatus':load('/tmp/rr2021/status.json'),
            'captureStatus':load('/tmp/rr2021/capture-status.json'),
          }
          pathlib.Path('diagnostics/live-aug25-2021-e2e.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          }
          trap cleanup EXIT
          export RESULT PHASE ERROR

          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SPACE_URL/api/recroom-wine/capabilities?ts=$(date +%s)" -o /tmp/rr2021/capability.json
          jq -e '.targetBuild == "7225744" and .targetManifest == "7611535694620830622" and .exactBuild == true and .checks.fingerprint == true and .clientFingerprint.attestedFromTrustedArchive == true and .recNetPublicServiceRelay == true and .recNetLocalServiceScheme == "https" and .recNetTlsVerificationBypassed == false' /tmp/rr2021/capability.json >/dev/null

          PHASE='firebase-auth'; export PHASE
          TEST_EMAIL="recroom-2021-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          TEST_PASSWORD="Rr!$(openssl rand -hex 18)"
          AUTH_CODE=$(curl -sS --max-time 30 -o /tmp/rr2021/auth.json -w '%{http_code}' -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$FIREBASE_API_KEY" -H 'content-type: application/json' --data "$(jq -cn --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password,returnSecureToken:true}')")
          test "$AUTH_CODE" = 200
          FIREBASE_TOKEN=$(jq -r '.idToken // empty' /tmp/rr2021/auth.json); test -n "$FIREBASE_TOKEN"

          PHASE='allocate'; export PHASE
          CREATE_CODE=$(curl -sS --max-time 45 -o /tmp/rr2021/create.json -w '%{http_code}' -X POST "$SPACE_URL/api/recroom-public/sessions" -H "authorization: Bearer $FIREBASE_TOKEN" -H 'content-type: application/json' --data '{"buildId":"recroom-2022-05-19"}')
          cat /tmp/rr2021/create.json
          test "$CREATE_CODE" = 202
          SESSION_ID=$(jq -r '.sessionId // empty' /tmp/rr2021/create.json)
          ACCESS_TOKEN=$(jq -r '.sessionAccessToken // .accessToken // empty' /tmp/rr2021/create.json)
          test -n "$SESSION_ID"; test -n "$ACCESS_TOKEN"

          PHASE='launch'; export PHASE
          READY=0
          for i in $(seq 1 110); do
            curl -fsS --max-time 20 "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID?accessToken=$ACCESS_TOKEN" -o /tmp/rr2021/status.json
            state=$(jq -r '.state // empty' /tmp/rr2021/status.json); phase=$(jq -r '.phase // empty' /tmp/rr2021/status.json); progress=$(jq -r '.progress // 0' /tmp/rr2021/status.json)
            echo "launch[$i] state=$state phase=$phase progress=$progress"
            if [ "$state" = ready ]; then READY=1; break; fi
            if [ "$state" = failed ]; then ERROR=$(jq -r '.error // "runtime failed"' /tmp/rr2021/status.json); export ERROR; exit 1; fi
            sleep 4
          done
          if [ "$READY" != 1 ]; then ERROR='Aug 25 2021 session never reached ready'; export ERROR; exit 1; fi
          jq -e '.provider == "ripoteam-wine"' /tmp/rr2021/status.json >/dev/null
          jq -e '.streamUrl | type == "string" and startswith("https://")' /tmp/rr2021/status.json >/dev/null

          PHASE='capture'; export PHASE
          CAP_CODE=$(curl -sS --max-time 30 -o /tmp/rr2021/capture-create.json -w '%{http_code}' -X POST "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/captures?accessToken=$ACCESS_TOKEN")
          test "$CAP_CODE" = 202
          CAPTURE_ID=$(jq -r '.captureId // empty' /tmp/rr2021/capture-create.json); test -n "$CAPTURE_ID"
          CAPREADY=0
          for i in $(seq 1 30); do
            curl -fsS --max-time 20 "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/captures/$CAPTURE_ID?accessToken=$ACCESS_TOKEN" -o /tmp/rr2021/capture-status.json
            cstate=$(jq -r '.state // empty' /tmp/rr2021/capture-status.json)
            if [ "$cstate" = ready ]; then CAPREADY=1; break; fi
            if [ "$cstate" = failed ]; then ERROR=$(jq -r '.error // "capture failed"' /tmp/rr2021/capture-status.json); export ERROR; exit 1; fi
            sleep 2
          done
          test "$CAPREADY" = 1
          curl -fsS --max-time 30 "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/captures/$CAPTURE_ID/image?accessToken=$ACCESS_TOKEN" -o /tmp/rr2021/recroom-live.png
          test "$(stat -c '%s' /tmp/rr2021/recroom-live.png)" -gt 1000
          PHASE='complete'; RESULT='success'; ERROR=''; export PHASE RESULT ERROR
          echo 'RECROOM_AUG25_2021_LIVE_E2E=true'
      - name: Commit E2E result
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          set -euo pipefail
          test -f diagnostics/live-aug25-2021-e2e.json || echo '{"result":"failure","phase":"workflow","error":"result file missing"}' > diagnostics/live-aug25-2021-e2e.json
          python3 - <<'PY'
          import json, pathlib, os
          p=pathlib.Path('diagnostics/live-aug25-2021-e2e.json'); d=json.loads(p.read_text()); d['workflowOutcome']=os.environ['TEST_OUTCOME']; p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/live-aug25-2021-e2e.json
          git commit -m 'Record Aug 25 2021 live launch through broker compatibility label' || true
          git pull --rebase origin main
          git push
      - name: Upload proof screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recroom-aug25-2021-live-proof
          path: /tmp/rr2021/recroom-live.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Require success
        if: steps.test.outcome != 'success'
        run: exit 1
