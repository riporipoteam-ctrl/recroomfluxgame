name: Official May 2022 Client Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/official-may-2022-client-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  steam-depot:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Install SteamCMD
        shell: powershell
        run: |
          choco install steamcmd -y --no-progress
          $steam = (Get-Command steamcmd.exe -ErrorAction SilentlyContinue).Source
          if (-not $steam) {
            $candidates = @(
              "C:\steamcmd\steamcmd.exe",
              "C:\ProgramData\chocolatey\bin\steamcmd.exe"
            )
            $steam = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $steam) { throw "SteamCMD was not installed." }
          "STEAMCMD=$steam" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Ask Valve for the exact free-game depot manifest
        shell: powershell
        run: |
          $content = Join-Path $env:RUNNER_TEMP "steam-content"
          New-Item -ItemType Directory -Force -Path $content | Out-Null
          Push-Location $content
          try {
            & $env:STEAMCMD `
              +@ShutdownOnFailedCommand 1 `
              +@NoPromptForPassword 1 `
              +login anonymous `
              +download_depot 471710 471711 6337851004861751095 `
              +quit
            if ($LASTEXITCODE -ne 0) { throw "Valve/SteamCMD rejected the anonymous depot request (exit $LASTEXITCODE)." }
          } finally {
            Pop-Location
          }

      - name: Verify May 19 2022 client layout without redistributing it
        shell: powershell
        run: |
          $roots = @(
            (Join-Path $env:RUNNER_TEMP "steam-content"),
            (Split-Path $env:STEAMCMD -Parent)
          )
          $exe = $null
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            $exe = Get-ChildItem -Path $root -Recurse -Filter "Recroom_Release.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) {
              $exe = Get-ChildItem -Path $root -Recurse -Filter "RecRoom.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if ($exe) { break }
          }
          if (-not $exe) { throw "SteamCMD completed but the Rec Room Windows executable was not found." }
          $gameDir = $exe.Directory.FullName
          $dataDir = Join-Path $gameDir "Recroom_Release_Data"
          if (-not (Test-Path $dataDir)) { $dataDir = Join-Path $gameDir "RecRoom_Data" }
          if (-not (Test-Path $dataDir)) { throw "Unity data directory was not found next to $($exe.Name)." }
          $bytes = (Get-ChildItem -Path $gameDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "OFFICIAL_DEPOT_OK=true"
          Write-Host "Executable=$($exe.FullName)"
          Write-Host "GameDir=$gameDir"
          Write-Host "Bytes=$bytes"
          Write-Host "The client was used only on this ephemeral runner and is not uploaded as an artifact."
