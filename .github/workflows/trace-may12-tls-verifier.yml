name: Trace May 12 Rec Room TLS verifier path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/trace-may12-tls-verifier.yml']

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download exact May 12 IL2CPP files
        shell: bash
        run: |
          set -euo pipefail
          base='https://archive.recagain.site/2022-05-12T06-50-19Z'
          curl -fsSL --retry 3 --max-time 240 "$base/GameAssembly.dll" -o GameAssembly.dll
          curl -fsSL --retry 3 --max-time 120 "$base/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat" -o global-metadata.dat
          echo '668bab489d24f883e95d0fd359e6a18a0b770e322d9efd823fb75087570a4a5f  GameAssembly.dll' | sha256sum -c -
          echo '5e5c499789b0af6ddd97e2a04725ee99f80037f8009622e2364eda0203050ecf  global-metadata.dat' | sha256sum -c -
      - name: Dump IL2CPP metadata
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/Perfare/Il2CppDumper.git dumper
          dotnet build dumper/Il2CppDumper/Il2CppDumper.csproj -c Release >/dev/null
          exe=$(find dumper/Il2CppDumper/bin/Release -type f -name 'Il2CppDumper.dll' | head -1)
          mkdir -p out
          cp GameAssembly.dll global-metadata.dat out/
          set +e
          (cd out && DOTNET_ROLL_FORWARD=Major dotnet "$GITHUB_WORKSPACE/$exe" GameAssembly.dll global-metadata.dat)
          set -e
          script=$(find "$GITHUB_WORKSPACE" -name script.json -type f | head -1)
          dump=$(find "$GITHUB_WORKSPACE" -name dump.cs -type f | head -1)
          cp "$script" out/script.json
          cp "$dump" out/dump.cs
          test -s out/script.json
          test -s out/dump.cs
      - name: Resolve verifier classes and disassemble BestHTTP TLS path
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pefile capstone
          mkdir -p diagnostics
          python3 - <<'PY' > diagnostics/may12-tls-verifier.txt
          import json,re,struct,pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          dump=open('out/dump.cs',errors='replace').read()
          print('=== ICertificateVerifyer implementers / nearby declarations ===')
          for m in re.finditer(r'(?m)^public class .*ICertificateVerifyer.*$', dump):
              a=max(0,m.start()-300); b=min(len(dump),m.start()+2500)
              print(dump[a:b])
              print('\n---\n')
          s=json.load(open('out/script.json'))
          methods=s.get('ScriptMethod',[]) or []
          wanted=[
            'BestHTTP.HTTPConnection$$Connect',
            'BestHTTP.HTTPManager$$.cctor',
            'BestHTTP.HTTPManager$$get_DefaultCertificateVerifyer',
            'BestHTTP.AlwaysValidVerifyer$$IsValid',
            'BestHTTP.SecureProtocol.Org.BouncyCastle.Crypto.Tls.LegacyTlsAuthentication$$NotifyServerCertificate',
            'BestHTTP.HTTPRequest$$set_CustomCertificateVerifyer',
          ]
          found={}
          for m in methods:
              n=str(m.get('Name',''))
              for w in wanted:
                  if n==w or n.endswith(w):
                      found[w]=int(m.get('Address',0))
          print('=== METHOD ADDRESSES ===')
          for w in wanted: print(w, hex(found.get(w,0)))
          pe=pefile.PE('GameAssembly.dll'); base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_64)
          def read_va(va,size):
              rva=va-base; off=pe.get_offset_from_rva(rva); return pe.__data__[off:off+size]
          for w in wanted:
              va=found.get(w,0)
              if not va: continue
              print(f'\n=== DISASM {w} @ {va:#x} ===')
              try:
                  for ins in md.disasm(read_va(va,900),va):
                      print(f'{ins.address:#x}: {ins.mnemonic} {ins.op_str}')
                      if ins.address>va+850: break
              except Exception as e: print('DISASM_ERROR',repr(e))
          setter=found.get('BestHTTP.HTTPRequest$$set_CustomCertificateVerifyer',0)
          if setter:
              x=[]
              for sec in pe.sections:
                  if not (sec.Characteristics & 0x20000000): continue
                  raw=sec.get_data(); sva=base+sec.VirtualAddress
                  for i in range(len(raw)-5):
                      if raw[i]!=0xE8: continue
                      rel=struct.unpack_from('<i',raw,i+1)[0]
                      if sva+i+5+rel==setter: x.append(sva+i)
              print('\n=== DIRECT SETTER XREFS ===')
              print('count',len(x))
              for v in x: print(hex(v))
          PY
      - name: Commit trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/may12-tls-verifier.txt
          git commit -m 'Record May 12 Rec Room TLS verifier trace'
          git push
