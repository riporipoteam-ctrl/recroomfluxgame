name: Parallel scan late 2020 RecNet verifier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/parallel-verifier-2020-fast.yml']

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        build:
          - { date: '2020-12-19T04-34-48Z', id: '5990230', manifest: '4784008965058944912' }
          - { date: '2020-11-10T09-04-46Z', id: '5797009', manifest: '976934657853877610' }
    steps:
      - uses: actions/checkout@v4
      - name: Inspect verifier classes if IL2CPP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics /tmp/out
          base='https://archive.recagain.site/${{ matrix.build.date }}'
          if ! curl -fsSL --retry 2 --max-time 180 "$base/GameAssembly.dll" -o /tmp/out/GameAssembly.dll; then
            printf 'DATE=${{ matrix.build.date }}\nBUILD=${{ matrix.build.id }}\nMANIFEST=${{ matrix.build.manifest }}\nRESULT=NO_GAMEASSEMBLY_MONO_OR_MISSING\n' > 'diagnostics/verifier-${{ matrix.build.id }}.txt'
          else
            if ! curl -fsSL --retry 2 --max-time 120 "$base/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat" -o /tmp/out/global-metadata.dat; then
              printf 'DATE=${{ matrix.build.date }}\nBUILD=${{ matrix.build.id }}\nMANIFEST=${{ matrix.build.manifest }}\nRESULT=NO_METADATA\n' > 'diagnostics/verifier-${{ matrix.build.id }}.txt'
            else
              git clone -q --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/dumper
              dotnet build /tmp/dumper/Il2CppDumper/Il2CppDumper.csproj -c Release >/dev/null
              exe=$(find /tmp/dumper/Il2CppDumper/bin/Release -type f -name 'Il2CppDumper.dll' | head -1)
              set +e
              (cd /tmp/out && DOTNET_ROLL_FORWARD=Major dotnet "$exe" GameAssembly.dll global-metadata.dat >/tmp/dumper.log 2>&1)
              set -e
              dump=$(find /tmp/dumper /tmp/out -name dump.cs -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
              test -n "$dump"
              python3 - "$dump" <<'PY' > 'diagnostics/verifier-${{ matrix.build.id }}.txt'
          import sys,re
          text=open(sys.argv[1],errors='replace').read()
          classes=[m.group(1).strip() for m in re.finditer(r'(?m)^public class ([^\r\n:{]+).*: ICertificateVerifyer\b.*$',text)]
          custom=[c for c in classes if 'AlwaysValidVerifyer' not in c]
          print('DATE=${{ matrix.build.date }}'); print('BUILD=${{ matrix.build.id }}'); print('MANIFEST=${{ matrix.build.manifest }}')
          print('ICERTIFICATEVERIFYER_CLASS_COUNT='+str(len(classes)))
          for c in classes: print('VERIFIER_CLASS='+c)
          print('CUSTOM_VERIFIER_COUNT='+str(len(custom)))
          print('RESULT=' + ('CUSTOM_VERIFIER_PRESENT' if custom else 'NO_CUSTOM_VERIFIER_CLASS'))
          PY
            fi
          fi
          cat 'diagnostics/verifier-${{ matrix.build.id }}.txt'
      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'diagnostics/verifier-${{ matrix.build.id }}.txt'
          git commit -m 'Record verifier scan for build ${{ matrix.build.id }}'
          for n in 1 2 3 4; do git pull --rebase origin main && git push && exit 0; sleep 2; done
          exit 1
