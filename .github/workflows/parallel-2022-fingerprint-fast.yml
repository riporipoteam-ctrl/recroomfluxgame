name: Parallel fingerprint candidate 2022 Rec Room builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/parallel-2022-fingerprint-fast.yml']

permissions:
  contents: write

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        build:
          - { date: '2022-04-15T06-50-51Z', id: '8538723', manifest: '5074805288827523797' }
          - { date: '2022-04-08T06-52-23Z', id: '8504784', manifest: '3300297416944352195' }
          - { date: '2022-03-30T06-50-13Z', id: '8442185', manifest: '4860694567153974568' }
          - { date: '2022-03-23T06-55-51Z', id: '8400677', manifest: '6498111350645449747' }
    steps:
      - uses: actions/checkout@v4
      - name: Hash critical files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 - <<'PY' > 'diagnostics/fingerprint-${{ matrix.build.id }}.json'
          import urllib.request,hashlib,json
          date='${{ matrix.build.date }}'; bid='${{ matrix.build.id }}'; manifest='${{ matrix.build.manifest }}'
          paths={
            'RecRoom.exe':'RecRoom.exe',
            'Recroom_Release.exe':'Recroom_Release.exe',
            'GameAssembly.dll':'GameAssembly.dll',
            'UnityPlayer.dll':'UnityPlayer.dll',
            'global-metadata.dat':'RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat',
          }
          out={'schema':1,'buildId':bid,'manifestId':manifest,'depotId':'471711','buildDate':date,'fingerprintScope':'criticalFiles','fileCount':len(paths),'criticalFiles':{}}
          canonical=[]
          for label,rel in paths.items():
            b=urllib.request.urlopen(f'https://archive.recagain.site/{date}/{rel}',timeout=240).read()
            h=hashlib.sha256(b).hexdigest(); n=len(b)
            out['criticalFiles'][label]={'path':rel,'size':n,'sha256':h}
            canonical.append(f'{rel}\0{n}\0{h}')
          out['totalBytes']=sum(v['size'] for v in out['criticalFiles'].values())
          out['fingerprintSha256']=hashlib.sha256('\n'.join(canonical).encode()).hexdigest()
          print(json.dumps(out,indent=2))
          PY
          cat 'diagnostics/fingerprint-${{ matrix.build.id }}.json'
      - name: Persist fingerprint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'diagnostics/fingerprint-${{ matrix.build.id }}.json'
          git commit -m 'Record fingerprint for build ${{ matrix.build.id }}'
          for n in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
