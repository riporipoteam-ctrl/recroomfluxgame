name: Find RecNet SPKI pin boundary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/find-2022-spki-pin-boundary.yml']

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        build:
          - date: '2020-11-04T09-04-52Z'
            build_id: '5764845'
            manifest: '4374408338230185042'
          - date: '2020-10-27T07-06-03Z'
            build_id: '5725402'
            manifest: '513509119891045939'
          - date: '2020-10-08T07-02-49Z'
            build_id: '5645945'
            manifest: '1830464523229227740'
          - date: '2020-09-29T13-03-57Z'
            build_id: '5609147'
            manifest: '2731970225462962921'
          - date: '2020-08-25T07-00-43Z'
            build_id: '5440520'
            manifest: '8745551450717882149'
          - date: '2020-07-28T07-00-49Z'
            build_id: '5330274'
            manifest: '37465864140382273'
          - date: '2020-06-26T07-00-36Z'
            build_id: '5187382'
            manifest: '2707793457083179066'
          - date: '2020-05-27T10-02-14Z'
            build_id: '5070286'
            manifest: '5708327461703404868'
    steps:
      - name: Scan exact metadata for RecNet SPKI pins
        shell: bash
        run: |
          set -euo pipefail
          url="https://archive.recagain.site/${{ matrix.build.date }}/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat"
          curl -fsSL --retry 3 --max-time 120 "$url" -o global-metadata.dat
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('global-metadata.dat').read_bytes()
          p1=bytes.fromhex('a7461e4bd2d01f98d5ff780d6eb6b2662384d38cbc4c50835d8977a3e90f13e0')
          p2=bytes.fromhex('cb80e833e6da1db731cfd19041d739b3a8fbb1da89a96bd46246b80e8ffa0053')
          c1,c2=b.count(p1),b.count(p2)
          print('BUILD_DATE=${{ matrix.build.date }}')
          print('BUILD_ID=${{ matrix.build.build_id }}')
          print('MANIFEST=${{ matrix.build.manifest }}')
          print('METADATA_SIZE=',len(b))
          print('METADATA_SHA256=',hashlib.sha256(b).hexdigest())
          print('PIN1_COUNT=',c1)
          print('PIN2_COUNT=',c2)
          print('LEGACY_NS_COUNT=',b.count(b'https://ns.rec.net/?v=2'))
          print('PIN_MATERIAL=' + ('PRESENT' if c1 or c2 else 'ABSENT'))
          PY
