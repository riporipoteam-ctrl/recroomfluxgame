name: Find 2022 SPKI pin boundary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/find-2022-spki-pin-boundary.yml']

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        build:
          - date: '2022-03-02T08-50-56Z'
            build_id: '8277540'
            manifest: '3923980740911990021'
          - date: '2022-02-25T08-54-49Z'
            build_id: '8263800'
            manifest: '2800208212683326113'
          - date: '2022-02-16T08-51-46Z'
            build_id: '8189847'
            manifest: '9037836832672645106'
          - date: '2022-02-09T08-51-09Z'
            build_id: '8149233'
            manifest: '9019523869596621972'
          - date: '2022-02-02T08-56-06Z'
            build_id: '8121767'
            manifest: '937523817675049833'
          - date: '2022-01-20T09-21-33Z'
            build_id: '8043275'
            manifest: '3008817658556881349'
    steps:
      - name: Scan exact metadata for RecNet SPKI pins
        shell: bash
        run: |
          set -euo pipefail
          url="https://archive.recagain.site/${{ matrix.build.date }}/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat"
          curl -fsSL --retry 3 --max-time 120 "$url" -o global-metadata.dat
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('global-metadata.dat').read_bytes()
          p1=bytes.fromhex('a7461e4bd2d01f98d5ff780d6eb6b2662384d38cbc4c50835d8977a3e90f13e0')
          p2=bytes.fromhex('cb80e833e6da1db731cfd19041d739b3a8fbb1da89a96bd46246b80e8ffa0053')
          c1,c2=b.count(p1),b.count(p2)
          print('BUILD_DATE=${{ matrix.build.date }}')
          print('BUILD_ID=${{ matrix.build.build_id }}')
          print('MANIFEST=${{ matrix.build.manifest }}')
          print('METADATA_SIZE=',len(b))
          print('METADATA_SHA256=',hashlib.sha256(b).hexdigest())
          print('PIN1_COUNT=',c1)
          print('PIN2_COUNT=',c2)
          print('LEGACY_NS_COUNT=',b.count(b'https://ns.rec.net/?v=2'))
          print('PIN_MATERIAL=' + ('PRESENT' if c1 or c2 else 'ABSENT'))
          PY
