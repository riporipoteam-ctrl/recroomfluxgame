name: Find RecNet SPKI pin boundary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/find-2022-spki-pin-boundary.yml']

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        build:
          - date: '2021-12-18T04-20-47Z'
            build_id: '7904601'
            manifest: '3025717471759017702'
          - date: '2021-12-16T08-55-06Z'
            build_id: '7865638'
            manifest: '2249469937166260586'
          - date: '2021-12-08T09-43-44Z'
            build_id: '7838552'
            manifest: '8856866088214255842'
          - date: '2021-12-03T08-51-24Z'
            build_id: '7805291'
            manifest: '5139685477820370365'
          - date: '2021-11-30T00-59-31Z'
            build_id: '7768445'
            manifest: '6893027030056397631'
          - date: '2021-11-20T00-04-25Z'
            build_id: '7706335'
            manifest: '7097242090446385427'
          - date: '2021-11-12T08-50-16Z'
            build_id: '7666521'
            manifest: '579262592839297531'
          - date: '2021-10-28T21-06-29Z'
            build_id: '7612856'
            manifest: '6847381068872640684'
    steps:
      - name: Scan exact metadata for RecNet SPKI pins
        shell: bash
        run: |
          set -euo pipefail
          url="https://archive.recagain.site/${{ matrix.build.date }}/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat"
          curl -fsSL --retry 3 --max-time 120 "$url" -o global-metadata.dat
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('global-metadata.dat').read_bytes()
          p1=bytes.fromhex('a7461e4bd2d01f98d5ff780d6eb6b2662384d38cbc4c50835d8977a3e90f13e0')
          p2=bytes.fromhex('cb80e833e6da1db731cfd19041d739b3a8fbb1da89a96bd46246b80e8ffa0053')
          c1,c2=b.count(p1),b.count(p2)
          print('BUILD_DATE=${{ matrix.build.date }}')
          print('BUILD_ID=${{ matrix.build.build_id }}')
          print('MANIFEST=${{ matrix.build.manifest }}')
          print('METADATA_SIZE=',len(b))
          print('METADATA_SHA256=',hashlib.sha256(b).hexdigest())
          print('PIN1_COUNT=',c1)
          print('PIN2_COUNT=',c2)
          print('LEGACY_NS_COUNT=',b.count(b'https://ns.rec.net/?v=2'))
          print('PIN_MATERIAL=' + ('PRESENT' if c1 or c2 else 'ABSENT'))
          PY
