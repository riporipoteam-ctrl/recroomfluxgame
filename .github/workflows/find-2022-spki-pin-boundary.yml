name: Find RecNet SPKI pin boundary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/find-2022-spki-pin-boundary.yml']

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        build:
          - date: '2020-03-27T06-58-55Z'
            build_id: '4802887'
            manifest: '2539899194395389618'
          - date: '2020-03-05T00-00-58Z'
            build_id: '4736207'
            manifest: '1385844251939419607'
          - date: '2020-02-03T20-02-40Z'
            build_id: '4630494'
            manifest: '385148847021849890'
          - date: '2020-01-27T22-25-16Z'
            build_id: '4606735'
            manifest: '7905064361203347857'
          - date: '2020-01-16T23-52-14Z'
            build_id: '4571169'
            manifest: '6354528156106512379'
          - date: '2019-12-19T21-30-25Z'
            build_id: '4504243'
            manifest: '5948698735243937255'
          - date: '2019-12-13T07-31-58Z'
            build_id: '4487985'
            manifest: '343815054766036484'
          - date: '2019-11-26T00-13-27Z'
            build_id: '4418879'
            manifest: '3758688414374192473'
    steps:
      - name: Scan exact metadata for RecNet SPKI pins
        shell: bash
        run: |
          set -euo pipefail
          url="https://archive.recagain.site/${{ matrix.build.date }}/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat"
          curl -fsSL --retry 3 --max-time 120 "$url" -o global-metadata.dat
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('global-metadata.dat').read_bytes()
          p1=bytes.fromhex('a7461e4bd2d01f98d5ff780d6eb6b2662384d38cbc4c50835d8977a3e90f13e0')
          p2=bytes.fromhex('cb80e833e6da1db731cfd19041d739b3a8fbb1da89a96bd46246b80e8ffa0053')
          c1,c2=b.count(p1),b.count(p2)
          print('BUILD_DATE=${{ matrix.build.date }}')
          print('BUILD_ID=${{ matrix.build.build_id }}')
          print('MANIFEST=${{ matrix.build.manifest }}')
          print('METADATA_SIZE=',len(b))
          print('METADATA_SHA256=',hashlib.sha256(b).hexdigest())
          print('PIN1_COUNT=',c1)
          print('PIN2_COUNT=',c2)
          print('LEGACY_NS_COUNT=',b.count(b'https://ns.rec.net/?v=2'))
          print('PIN_MATERIAL=' + ('PRESENT' if c1 or c2 else 'ABSENT'))
          PY
