name: Fingerprint March 27 2020 production candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fingerprint-mar27-production.yml']

permissions:
  contents: write

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download and fingerprint exact critical files
        shell: bash
        run: |
          set -euo pipefail
          base='https://archive.recagain.site/2020-03-27T06-58-55Z'
          rm -rf /tmp/mar27 && mkdir -p /tmp/mar27 diagnostics
          declare -A urls
          for f in RecRoom.exe Recroom_Release.exe GameAssembly.dll UnityPlayer.dll; do
            if curl -fsSL --retry 2 --max-time 180 "$base/$f" -o "/tmp/mar27/$f"; then
              echo "FOUND_ROOT_FILE=$f SIZE=$(stat -c%s /tmp/mar27/$f) SHA=$(sha256sum /tmp/mar27/$f | awk '{print $1}')"
            fi
          done
          metadata=''
          for rel in \
            'Recroom_Release_Data/il2cpp_data/Metadata/global-metadata.dat' \
            'RecRoom_Release_Data/il2cpp_data/Metadata/global-metadata.dat' \
            'RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat'; do
            if curl -fsSL --retry 1 --max-time 120 "$base/$rel" -o /tmp/mar27/global-metadata.dat; then metadata="$rel"; break; fi
          done
          test -n "$metadata"
          META_PATH="$metadata" python3 - <<'PY' > diagnostics/fingerprint-4802887-production.json
          from pathlib import Path
          import hashlib,json,os
          root=Path('/tmp/mar27')
          mapping={}
          for name in ('RecRoom.exe','Recroom_Release.exe','GameAssembly.dll','UnityPlayer.dll'):
              p=root/name
              if p.is_file(): mapping[name]=name
          mapping['global-metadata.dat']=os.environ['META_PATH']
          out={'schema':1,'buildId':'4802887','manifestId':'2539899194395389618','depotId':'471711','buildDate':'2020-03-27T06-58-55Z','updateName':'the "Rec Room Plus" edition','fingerprintScope':'criticalFiles','criticalFiles':{}}
          canonical=[]
          for label,rel in mapping.items():
              p=root/('global-metadata.dat' if label=='global-metadata.dat' else rel)
              b=p.read_bytes(); h=hashlib.sha256(b).hexdigest(); n=len(b)
              out['criticalFiles'][label]={'path':rel,'size':n,'sha256':h}
              canonical.append(f'{rel}\0{n}\0{h}')
          out['fileCount']=len(mapping); out['totalBytes']=sum(v['size'] for v in out['criticalFiles'].values())
          out['fingerprintSha256']=hashlib.sha256('\n'.join(canonical).encode()).hexdigest()
          print(json.dumps(out,indent=2))
          PY
          python3 - <<'PY'
          b=open('/tmp/mar27/global-metadata.dat','rb').read()
          for s in (b'https://ns.rec.net/?v=2',b'https://ns.rec.net'):
              print(s.decode(), 'COUNT=', b.count(s))
          PY
          cat diagnostics/fingerprint-4802887-production.json
      - name: Commit fingerprint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/fingerprint-4802887-production.json
          git commit -m 'Record production fingerprint for build 4802887'
          for n in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 2; done
          exit 1
