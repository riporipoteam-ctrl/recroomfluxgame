name: Smoke Aug 25 2021 Steam login stream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/smoke-aug25-steam-login.yml']

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space
      FIREBASE_API_KEY: AIzaSyBV_ev8AVpKwgioPSSWiBYf8UU09bLbWOU
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact 2021 runtime and reach Steam login
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics /tmp/steam-smoke
          SESSION_ID=''; ACCESS_TOKEN=''; FIREBASE_TOKEN=''; PHASE='waiting-runtime'; ERROR=''; RESULT='failure'
          cleanup() {
            set +e
            if [ -n "$SESSION_ID" ] && [ -n "$ACCESS_TOKEN" ]; then
              curl -sS --max-time 20 -X POST "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/release?accessToken=$ACCESS_TOKEN" >/dev/null || true
            fi
            if [ -n "$FIREBASE_TOKEN" ]; then
              curl -sS --max-time 20 -X POST "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$FIREBASE_API_KEY" -H 'content-type: application/json' --data "$(jq -cn --arg t "$FIREBASE_TOKEN" '{idToken:$t}')" >/dev/null || true
            fi
            python3 - <<'PY'
          import json, pathlib, os
          def load(p):
              try:return json.loads(pathlib.Path(p).read_text())
              except Exception:return None
          out={'result':os.environ.get('RESULT','failure'),'phase':os.environ.get('PHASE','unknown'),'error':os.environ.get('ERROR',''),'capability':load('/tmp/steam-smoke/cap.json'),'sessionCreate':load('/tmp/steam-smoke/create.json'),'sessionStatus':load('/tmp/steam-smoke/status.json'),'captureStatus':load('/tmp/steam-smoke/capture-status.json')}
          pathlib.Path('diagnostics/aug25-2021-steam-login-smoke.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          }
          trap cleanup EXIT
          export PHASE ERROR RESULT

          READY=0
          for i in $(seq 1 160); do
            code=$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/steam-smoke/cap.json -w '%{http_code}' "$SPACE_URL/api/recroom-wine/capabilities?ts=$(date +%s)" || true)
            build=$(jq -r '.targetBuild // empty' /tmp/steam-smoke/cap.json 2>/dev/null || true)
            exact=$(jq -r '.exactBuild // false' /tmp/steam-smoke/cap.json 2>/dev/null || true)
            if [ "$code" = 200 ] && [ "$build" = 7225744 ] && [ "$exact" = true ]; then READY=1; break; fi
            sleep 4
          done
          if [ "$READY" != 1 ]; then ERROR='exact Aug 25 2021 client never became ready'; export ERROR; exit 1; fi

          PHASE='firebase'; export PHASE
          EMAIL="steam-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          PASS="Rr!$(openssl rand -hex 18)"
          code=$(curl -sS --max-time 30 -o /tmp/steam-smoke/auth.json -w '%{http_code}' -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$FIREBASE_API_KEY" -H 'content-type: application/json' --data "$(jq -cn --arg email "$EMAIL" --arg password "$PASS" '{email:$email,password:$password,returnSecureToken:true}')")
          test "$code" = 200
          FIREBASE_TOKEN=$(jq -r '.idToken // empty' /tmp/steam-smoke/auth.json); test -n "$FIREBASE_TOKEN"

          PHASE='allocate'; export PHASE
          code=$(curl -sS --max-time 45 -o /tmp/steam-smoke/create.json -w '%{http_code}' -X POST "$SPACE_URL/api/recroom-public/sessions" -H "authorization: Bearer $FIREBASE_TOKEN" -H 'content-type: application/json' --data '{"buildId":"recroom-2021-08-25"}')
          cat /tmp/steam-smoke/create.json
          test "$code" = 202
          SESSION_ID=$(jq -r '.sessionId // empty' /tmp/steam-smoke/create.json)
          ACCESS_TOKEN=$(jq -r '.sessionAccessToken // .accessToken // empty' /tmp/steam-smoke/create.json)
          test -n "$SESSION_ID"; test -n "$ACCESS_TOKEN"

          PHASE='steam-login'; export PHASE
          INTERACTIVE=0
          for i in $(seq 1 100); do
            curl -fsS --max-time 20 "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID?accessToken=$ACCESS_TOKEN" -o /tmp/steam-smoke/status.json
            state=$(jq -r '.state // empty' /tmp/steam-smoke/status.json)
            phase=$(jq -r '.phase // empty' /tmp/steam-smoke/status.json)
            stream=$(jq -r '.streamUrl // empty' /tmp/steam-smoke/status.json)
            echo "steam[$i] state=$state phase=$phase stream=$([ -n "$stream" ] && echo yes || echo no)"
            if [ "$phase" = steam-login-required ] && [[ "$stream" == https://* ]]; then INTERACTIVE=1; break; fi
            if [ "$state" = failed ]; then ERROR=$(jq -r '.error // "runtime failed"' /tmp/steam-smoke/status.json); export ERROR; exit 1; fi
            sleep 3
          done
          if [ "$INTERACTIVE" != 1 ]; then ERROR='interactive Steam login stream was not published'; export ERROR; exit 1; fi

          code=$(curl -sS --max-time 30 -o /tmp/steam-smoke/capture-create.json -w '%{http_code}' -X POST "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/captures?accessToken=$ACCESS_TOKEN")
          test "$code" = 202
          CID=$(jq -r '.captureId // empty' /tmp/steam-smoke/capture-create.json); test -n "$CID"
          CREADY=0
          for i in $(seq 1 30); do
            curl -fsS --max-time 20 "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/captures/$CID?accessToken=$ACCESS_TOKEN" -o /tmp/steam-smoke/capture-status.json
            cs=$(jq -r '.state // empty' /tmp/steam-smoke/capture-status.json)
            if [ "$cs" = ready ]; then CREADY=1; break; fi
            if [ "$cs" = failed ]; then ERROR=$(jq -r '.error // "capture failed"' /tmp/steam-smoke/capture-status.json); export ERROR; exit 1; fi
            sleep 2
          done
          test "$CREADY" = 1
          curl -fsS --max-time 30 "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/captures/$CID/image?accessToken=$ACCESS_TOKEN" -o /tmp/steam-smoke/steam-login.jpg
          test "$(stat -c '%s' /tmp/steam-smoke/steam-login.jpg)" -gt 1000
          RESULT='success'; ERROR=''; export RESULT ERROR
          echo 'AUG25_2021_STEAM_LOGIN_STREAM=true'
      - name: Commit smoke result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          set -euo pipefail
          test -f diagnostics/aug25-2021-steam-login-smoke.json || echo '{"result":"failure","phase":"workflow","error":"result file missing"}' > diagnostics/aug25-2021-steam-login-smoke.json
          python3 - <<'PY'
          import json, pathlib, os
          p=pathlib.Path('diagnostics/aug25-2021-steam-login-smoke.json'); d=json.loads(p.read_text()); d['workflowOutcome']=os.environ['TEST_OUTCOME']; p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/aug25-2021-steam-login-smoke.json
          git commit -m 'Record Aug 2021 Steam login smoke result' || true
          git pull --rebase origin main
          git push
      - name: Upload Steam login proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aug25-2021-steam-login-proof
          path: /tmp/steam-smoke/steam-login.jpg
          if-no-files-found: ignore
          retention-days: 1
      - name: Require success
        if: steps.test.outcome != 'success'
        run: exit 1
