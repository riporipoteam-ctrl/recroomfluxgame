name: Rec Room 2022 gateway CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check client/host scripts
        run: |
          node --check scripts/verify-client.mjs
          node --check scripts/scan-client-urls.mjs
          node --check scripts/patch-client-urls.mjs
          node --check scripts/host-proxy.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
