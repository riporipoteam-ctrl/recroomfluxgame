name: Trace early 2021 RecNet bootstrap verifier path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/trace-jan-feb-2021-recnet.yml']

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        build:
          - { date: '2021-01-28T09-28-46Z', id: '6120182', manifest: '8936309613064529436' }
          - { date: '2021-02-05T18-33-03Z', id: '6161584', manifest: '4214176151769797014' }
    steps:
      - uses: actions/checkout@v4
      - name: Download exact IL2CPP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rr
          base='https://archive.recagain.site/${{ matrix.build.date }}'
          curl -fsSL --retry 2 --max-time 180 "$base/GameAssembly.dll" -o /tmp/rr/GameAssembly.dll
          curl -fsSL --retry 2 --max-time 120 "$base/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat" -o /tmp/rr/global-metadata.dat || \
          curl -fsSL --retry 2 --max-time 120 "$base/Recroom_Release_Data/il2cpp_data/Metadata/global-metadata.dat" -o /tmp/rr/global-metadata.dat
      - name: Dump IL2CPP and trace nameserver literal xrefs
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/dumper
          dotnet build /tmp/dumper/Il2CppDumper/Il2CppDumper.csproj -c Release >/dev/null
          exe=$(find /tmp/dumper/Il2CppDumper/bin/Release -type f -name 'Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/out diagnostics
          cp /tmp/rr/GameAssembly.dll /tmp/rr/global-metadata.dat /tmp/out/
          set +e
          (cd /tmp/out && DOTNET_ROLL_FORWARD=Major dotnet "$exe" GameAssembly.dll global-metadata.dat >/tmp/dumper.log 2>&1)
          set -e
          script=$(find /tmp/dumper /tmp/out -name script.json -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          strings=$(find /tmp/dumper /tmp/out -name stringliteral.json -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          dump=$(find /tmp/dumper /tmp/out -name dump.cs -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          cp "$script" /tmp/out/script.json
          cp "$strings" /tmp/out/stringliteral.json
          cp "$dump" /tmp/out/dump.cs
          python3 -m pip install -q pefile capstone
          python3 - <<'PY' > 'diagnostics/recnet-bootstrap-${{ matrix.build.id }}.txt'
          import json,re,pefile,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_MEM,X86_REG_RIP
          bid='${{ matrix.build.id }}'; date='${{ matrix.build.date }}'; manifest='${{ matrix.build.manifest }}'
          s=json.load(open('/tmp/out/script.json')); sl=json.load(open('/tmp/out/stringliteral.json'))
          pe=pefile.PE('/tmp/rr/GameAssembly.dll'); base=int(pe.OPTIONAL_HEADER.ImageBase)
          def va(a):
              a=int(a)
              return a if a>=base else base+a
          methods=sorted((va(int(m.get('Address',0))),str(m.get('Name',''))) for m in (s.get('ScriptMethod') or []) if int(m.get('Address',0) or 0)>0)
          print('DATE='+date); print('BUILD='+bid); print('MANIFEST='+manifest); print(f'IMAGE_BASE={base:#x}')
          targets=[]
          for row in sl:
              v=str(row.get('value') or row.get('Value') or '')
              if 'ns.rec.net' in v:
                  a=row.get('address',row.get('Address')); a=int(a,16) if isinstance(a,str) else int(a); a=va(a)
                  targets.append((a,v)); print(f'NS_LITERAL={v} ADDRESS={a:#x}')
          dumptext=open('/tmp/out/dump.cs',errors='replace').read()
          print('=== ICertificateVerifyer classes ===')
          classes=[m.group(1).strip() for m in re.finditer(r'(?m)^public class ([^\r\n:{]+).*: ICertificateVerifyer\b.*$',dumptext)]
          for c in classes: print('VERIFIER_CLASS='+c)
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          refs=[]; targetset={a for a,_ in targets}
          for sec in pe.sections:
              if not (sec.Characteristics & 0x20000000): continue
              raw=sec.get_data(); secva=base+int(sec.VirtualAddress)
              for ins in md.disasm(raw,secva):
                  for op in ins.operands:
                      if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                          dest=ins.address+ins.size+op.mem.disp
                          if dest in targetset: refs.append((ins.address,dest,ins.mnemonic,ins.op_str))
          print('NS_XREF_COUNT='+str(len(refs)))
          addrs=[a for a,_ in methods]; owners=[]
          for addr,dest,mn,op in refs:
              i=bisect.bisect_right(addrs,addr)-1; owner=methods[i] if i>=0 else (0,'UNKNOWN'); owners.append(owner)
              print(f'NS_XREF={addr:#x} OWNER={owner[1]} OWNER_VA={owner[0]:#x} INS={mn} {op}')
          seen=set()
          for ova,oname in owners:
              if not ova or ova in seen: continue
              seen.add(ova); print(f'=== OWNER_DISASM {oname} @ {ova:#x} ===')
              try:
                  off=pe.get_offset_from_rva(ova-base); code=pe.__data__[off:off+2200]
                  for ins in md.disasm(code,ova):
                      print(f'{ins.address:#x}: {ins.mnemonic} {ins.op_str}')
                      if ins.address>ova+2150: break
              except Exception as e: print('DISASM_ERROR='+repr(e))
          print('=== VERIFIER METHODS ===')
          for m in s.get('ScriptMethod') or []:
              n=str(m.get('Name','')); raw=int(m.get('Address',0) or 0)
              if not raw: continue
              if any(c+'$$IsValid' in n or c+'$$.cctor' in n for c in classes):
                  a=va(raw); print(f'METHOD={n} VA={a:#x}')
                  try:
                      off=pe.get_offset_from_rva(a-base); code=pe.__data__[off:off+1400]
                      for ins in md.disasm(code,a):
                          print(f'{ins.address:#x}: {ins.mnemonic} {ins.op_str}')
                          if ins.address>a+1350: break
                  except Exception as e: print('DISASM_ERROR='+repr(e))
          PY
          cat 'diagnostics/recnet-bootstrap-${{ matrix.build.id }}.txt'
      - name: Persist trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'diagnostics/recnet-bootstrap-${{ matrix.build.id }}.txt'
          git commit -m 'Record normalized early 2021 RecNet trace for ${{ matrix.build.id }}'
          for n in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 2; done
          exit 1
