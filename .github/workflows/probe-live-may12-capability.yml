name: Probe live production Rec Room capability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-live-may12-capability.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for March 27 production runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          URL='https://echoxr-ripoteam-cloud-pc.hf.space/api/recroom-wine/capabilities'
          matched=0
          for n in $(seq 1 36); do
            code=$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/cap.json -w '%{http_code}' "$URL?ts=$(date +%s)-$n" || true)
            if [ "$code" = 200 ]; then
              build=$(python3 -c "import json;print(json.load(open('/tmp/cap.json')).get('targetBuild',''))" 2>/dev/null || true)
              transport=$(python3 -c "import json;print(json.load(open('/tmp/cap.json')).get('recNetTransport',''))" 2>/dev/null || true)
              exact=$(python3 -c "import json;print(str(json.load(open('/tmp/cap.json')).get('exactBuild',False)).lower())" 2>/dev/null || true)
              echo "attempt=$n build=$build transport=$transport exact=$exact"
              cp /tmp/cap.json diagnostics/live-production-capability.json
              if [ "$build" = '4802887' ] && [ "$transport" = 'trusted-public-https-bootstrap-local-http-mar27-v1' ]; then
                matched=1
                break
              fi
            else
              echo "attempt=$n HTTP=$code"
            fi
            sleep 10
          done
          python3 -m json.tool diagnostics/live-production-capability.json > /tmp/pretty.json
          mv /tmp/pretty.json diagnostics/live-production-capability.json
          echo "MAR27_RUNTIME_MATCH=$matched"
          cat diagnostics/live-production-capability.json
          test "$matched" = 1
      - name: Commit diagnostic snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f diagnostics/live-production-capability.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/live-production-capability.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record live production Rec Room capability'
          for n in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 2; done
          exit 1
