name: Recover May 2022 Nameserver Contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/decompile-may2022-nameserver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download exact May 2022 IL2CPP inputs
        shell: bash
        run: |
          set -euo pipefail
          base='https://archive.recagain.site/2022-05-19T06-50-09Z'
          curl -fsSL --connect-timeout 15 --max-time 300 -A 'RipoTeam-May2022-IL2CPP/1.0' "$base/GameAssembly.dll" -o GameAssembly.dll
          curl -fsSL --connect-timeout 15 --max-time 300 -A 'RipoTeam-May2022-IL2CPP/1.0' "$base/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat" -o global-metadata.dat
          test "$(sha256sum GameAssembly.dll | cut -d' ' -f1)" = '2ba4571be2791602386bf02581805e021568ccfeacce6cd265450974b7ea8f27'
          test "$(sha256sum global-metadata.dat | cut -d' ' -f1)" = 'd77f3728ba1f3765941f90de036f6b283301c156db3d7e31932e56c9b06a9b0c'

      - name: Run Il2CppDumper
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 120 \
            'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip' -o dumper.zip
          mkdir dumper out
          unzip -q dumper.zip -d dumper
          dll="$(find dumper -type f -name 'Il2CppDumper.dll' | head -1)"
          test -n "$dll"
          set +e
          dotnet "$dll" "$PWD/GameAssembly.dll" "$PWD/global-metadata.dat" "$PWD/out" >il2cppdumper.log 2>&1
          code=$?
          set -e
          echo "Il2CppDumper exit=$code"
          # v6.7.46 may abort only after it has written all output because its
          # final Console.ReadKey() has no TTY. The dump itself is authoritative.
          test -s out/dump.cs
          test -s out/script.json

      - name: Extract only nameserver-related declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('out/dump.cs')
          lines=path.read_text(errors='replace').splitlines()
          exact=re.compile(r'(?i)(NameServer|RecNet.*Config|Config.*RecNet|Service.*Url|Url.*Service|ApiUrl|AuthUrl|Accounts?Url|Rooms?Url|Matchmaking.*Url|Photon.*Url|Leaderboard.*Url|Commerce.*Url|Economy.*Url|Discovery.*Url|Notification.*Url)')
          hit_indexes=[i for i,line in enumerate(lines) if exact.search(line)]
          # Collapse neighboring hits so we get complete class declarations without a giant dump.
          ranges=[]
          for i in hit_indexes:
              lo=max(0,i-30); hi=min(len(lines),i+80)
              if ranges and lo <= ranges[-1][1]+20:
                  ranges[-1]=(ranges[-1][0],max(ranges[-1][1],hi))
              else:
                  ranges.append((lo,hi))
          out=[]
          for lo,hi in ranges:
              out.append(f'===== dump.cs lines {lo+1}-{hi} =====')
              out.extend(f'{j+1}: {lines[j]}' for j in range(lo,hi))
          text='\n'.join(out)
          Path('nameserver-contract-findings.txt').write_text(text,encoding='utf-8')
          print(text[:160000])
          print('HITS=',len(hit_indexes),'RANGES=',len(ranges))
          PY

      - name: Upload compact contract findings
        uses: actions/upload-artifact@v4
        with:
          name: may2022-nameserver-contract
          path: nameserver-contract-findings.txt
          retention-days: 3
