name: Audit final Aug 25 2021 RipoTeamServer branch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-ripoteam-aug25-2021-branch.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact final server branch
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch recroom-aug25-2021-final https://github.com/riporipoteam-ctrl/ripoteamserver.git server
          git -C server rev-parse HEAD > /tmp/server-sha
      - name: Compile and validate Aug 2021 final branch
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            server/hf-space/recroom_autoload.py \
            server/hf-space/recroom_2021_gateway_config.py \
            server/hf-space/recroom_2021_nameserver_contract.py \
            server/hf-space/recroom_2021_archive_attestation.py \
            server/hf-space/recroom_2021_metadata_locator.py \
            server/hf-space/recroom_build_fingerprint.py \
            server/hf-space/recroom_https_recnet_fix.py
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('server')
          fp=json.loads((root/'hf-space/recroom-may-2022-fingerprint.json').read_text())
          assert fp['buildId']=='7225744', fp
          assert fp['manifestId']=='7611535694620830622', fp
          assert fp['buildDate']=='2021-08-25T06-50-15Z', fp
          assert fp['trustedArchiveUrl']=='https://archive.recagain.site/download/2021-08-25T06-50-15Z', fp
          assert fp['bootstrapFingerprintFromTrustedArchive'] is True, fp
          autoload=(root/'hf-space/recroom_autoload.py').read_text()
          assert '2021-08-25T06-50-15Z' in autoload
          assert '20210827_prod' in autoload
          assert 'recroom_2021_archive_attestation' in autoload
          assert 'recroom_2021_metadata_locator' in autoload
          transport=(root/'hf-space/recroom_https_recnet_fix.py').read_text()
          assert 'public-https-bootstrap-public-https-services-aug25-2021-v2' in transport
          assert 'recNetTlsVerificationBypassed' in transport and 'False' in transport
          e2e=(root/'.github/workflows/recroom-native-live-launch.yml').read_text()
          assert 'recroom-2021-08-25' in e2e
          for path in [
            root/'hf-space/recroom_autoload.py',
            root/'hf-space/recroom_2021_gateway_config.py',
            root/'hf-space/recroom_2021_nameserver_contract.py',
            root/'hf-space/recroom_2021_archive_attestation.py',
            root/'hf-space/recroom_2021_metadata_locator.py',
            root/'hf-space/recroom-may-2022-fingerprint.json',
            root/'hf-space/recroom_https_recnet_fix.py',
            root/'.github/workflows/recroom-native-live-launch.yml',
          ]:
            text=path.read_text()
            assert '2020-03-27' not in text, path
            assert '2019-' not in text, path
          print('AUG25_2021_FINAL_BRANCH_AUDIT=true')
          PY
      - name: Persist audit result
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo "AUDIT_OUTCOME=$AUDIT_OUTCOME"
            echo "SERVER_SHA=$(cat /tmp/server-sha 2>/dev/null || echo unavailable)"
            echo "TARGET_BUILD=7225744"
            echo "TARGET_MANIFEST=7611535694620830622"
            echo "BRANCH=recroom-aug25-2021-final"
          } > diagnostics/aug25-2021-branch-audit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/aug25-2021-branch-audit.txt
          git commit -m 'Record final Aug 25 2021 branch audit result' || exit 0
          git pull --rebase origin main
          git push
          test "$AUDIT_OUTCOME" = success
