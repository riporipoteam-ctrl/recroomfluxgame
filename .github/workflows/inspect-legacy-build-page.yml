name: Inspect legacy RecAgain build page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-legacy-build-page.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        date:
          - '2020-04-08T06-56-55Z'
          - '2020-03-27T06-58-55Z'
          - '2019-12-19T21-30-25Z'
    steps:
      - name: Inspect page source and referenced endpoints
        shell: bash
        run: |
          set -euo pipefail
          url="https://archive.recagain.site/${{ matrix.date }}"
          curl -fsSL --retry 2 --max-time 30 "$url" -o page.html
          echo "DATE=${{ matrix.date }} PAGE_BYTES=$(stat -c%s page.html)"
          echo '--- relevant text/links ---'
          grep -Eio '.{0,100}(Assembly-CSharp|Managed|Recroom_Release_Data|RecRoom_Data|files|api/[^"'"' ]+|download[^"'"' ]*).{0,160}' page.html | head -200 || true
          echo '--- href/src/url candidates ---'
          grep -Eo '(href|src)="[^"]+"' page.html | grep -Ei 'file|download|api|data|manifest' | head -200 || true
