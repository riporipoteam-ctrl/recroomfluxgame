name: Fingerprint spring 2020 Rec Room candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/parallel-spring2020-fingerprint.yml']

permissions:
  contents: write

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        build:
          - { date: '2020-04-20T07-32-18Z', id: '4912996', manifest: '9119006898280485087' }
          - { date: '2020-04-08T06-56-55Z', id: '4857256', manifest: '3706709507199582170' }
          - { date: '2020-03-27T06-58-55Z', id: '4802887', manifest: '2539899194395389618' }
          - { date: '2020-03-10T09-08-39Z', id: '4752558', manifest: '4766551521966830741' }
    steps:
      - uses: actions/checkout@v4
      - name: Hash critical files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 - <<'PY' > 'diagnostics/fingerprint-${{ matrix.build.id }}.json'
          import urllib.request,urllib.error,hashlib,json
          date='${{ matrix.build.date }}'; bid='${{ matrix.build.id }}'; manifest='${{ matrix.build.manifest }}'
          candidates={
            'RecRoom.exe':['RecRoom.exe'],
            'Recroom_Release.exe':['Recroom_Release.exe'],
            'GameAssembly.dll':['GameAssembly.dll'],
            'UnityPlayer.dll':['UnityPlayer.dll'],
            'global-metadata.dat':['RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat'],
          }
          out={'schema':1,'buildId':bid,'manifestId':manifest,'depotId':'471711','buildDate':date,'fingerprintScope':'criticalFiles','criticalFiles':{}}
          canonical=[]
          for label,rels in candidates.items():
            b=None; used=None
            for rel in rels:
              try:
                b=urllib.request.urlopen(f'https://archive.recagain.site/{date}/{rel}',timeout=240).read(); used=rel; break
              except Exception: pass
            if b is None:
              out['criticalFiles'][label]={'path':rels[0],'missing':True}; continue
            h=hashlib.sha256(b).hexdigest(); n=len(b)
            out['criticalFiles'][label]={'path':used,'size':n,'sha256':h}
            canonical.append(f'{used}\0{n}\0{h}')
          out['fileCount']=sum(1 for v in out['criticalFiles'].values() if not v.get('missing'))
          out['totalBytes']=sum(v.get('size',0) for v in out['criticalFiles'].values())
          out['fingerprintSha256']=hashlib.sha256('\n'.join(canonical).encode()).hexdigest()
          print(json.dumps(out,indent=2))
          PY
          cat 'diagnostics/fingerprint-${{ matrix.build.id }}.json'
      - name: Persist fingerprint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'diagnostics/fingerprint-${{ matrix.build.id }}.json'
          git commit -m 'Record fingerprint for build ${{ matrix.build.id }}'
          for n in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 2; done
          exit 1
