name: Trace May 12 TLS verifier path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/trace-may12-tls-verifier-path.yml']

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact May 12 IL2CPP files
        shell: bash
        run: |
          set -euo pipefail
          base='https://archive.recagain.site/2022-05-12T06-50-19Z'
          curl -fsSL --retry 3 --max-time 240 "$base/GameAssembly.dll" -o GameAssembly.dll
          curl -fsSL --retry 3 --max-time 120 "$base/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat" -o global-metadata.dat
          echo '668bab489d24f883e95d0fd359e6a18a0b770e322d9efd823fb75087570a4a5f  GameAssembly.dll' | sha256sum -c -
          echo '5e5c499789b0af6ddd97e2a04725ee99f80037f8009622e2364eda0203050ecf  global-metadata.dat' | sha256sum -c -

      - name: Generate method map
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/Perfare/Il2CppDumper.git dumper
          dotnet build dumper/Il2CppDumper/Il2CppDumper.csproj -c Release >/dev/null
          exe=$(find dumper/Il2CppDumper/bin/Release -type f -name 'Il2CppDumper.dll' | head -1)
          mkdir -p out
          cp GameAssembly.dll global-metadata.dat out/
          (cd out && DOTNET_ROLL_FORWARD=Major dotnet "$GITHUB_WORKSPACE/$exe" GameAssembly.dll global-metadata.dat) || true
          echo 'Generated outputs:'
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -s out/script.json
          test -s out/dump.cs

      - name: Disassemble verifier-related methods and caller xrefs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pefile capstone
          python3 - <<'PY'
          import json, pefile, struct, re
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          s=json.load(open('out/script.json'))
          methods=s.get('ScriptMethod',[])
          wanted=[
            'HTTPConnection$$Connect','HTTPManager$$.cctor',
            'HTTPRequest$$get_CustomCertificateVerifyer','HTTPRequest$$set_CustomCertificateVerifyer',
            'AlwaysValidVerifyer$$IsValid','LegacyTlsAuthentication$$NotifyServerCertificate',
            'LegacyTlsClient$$.ctor'
          ]
          found=[]
          for m in methods:
            n=str(m.get('Name',''))
            if any(w in n for w in wanted):
              found.append((n,int(m.get('Address',0))))
          for n,a in found: print(f'METHOD {n} VA=0x{a:x}')
          pe=pefile.PE('GameAssembly.dll'); base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_64)
          def bytes_at(va,n=0x520):
            off=pe.get_offset_from_rva(va-base); return pe.__data__[off:off+n]
          for name,va in found:
            if not va: continue
            print('\n===== DISASM',name,'0x%x'%va,'=====')
            for ins in md.disasm(bytes_at(va),va):
              print(f'{ins.address:016x}: {ins.mnemonic:8} {ins.op_str}')
          setter=next((a for n,a in found if 'set_CustomCertificateVerifyer' in n),0)
          if setter:
            xs=[]
            for sec in pe.sections:
              if not (sec.Characteristics & 0x20000000): continue
              raw=sec.get_data(); sva=base+sec.VirtualAddress; pos=0
              while True:
                i=raw.find(b'\xe8',pos)
                if i<0 or i+5>len(raw): break
                rel=struct.unpack_from('<i',raw,i+1)[0]
                if sva+i+5+rel==setter: xs.append(sva+i)
                pos=i+1
            print('SETTER_DIRECT_XREFS=',','.join(hex(x) for x in xs) if xs else 'NONE')
          dump=open('out/dump.cs',encoding='utf-8',errors='ignore').read()
          print('\n===== VERIFIER TYPES / MEMBERS =====')
          lines=dump.splitlines()
          for i,line in enumerate(lines):
            if ('ICertificateVerifyer' in line or 'CustomCertificateVerifyer' in line or
                'AlwaysValidVerifyer' in line or re.search(r'\bIsValid\s*\(',line)):
              lo=max(0,i-3); hi=min(len(lines),i+5)
              print('\n'.join(lines[lo:hi])); print('---')
          PY
