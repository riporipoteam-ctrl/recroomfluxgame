name: Extract May 2022 RecNet Bootstrap Core

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/decompile-may2022-recnet-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download exact build 8751857 IL2CPP inputs
        shell: bash
        run: |
          set -euo pipefail
          base='https://archive.recagain.site/2022-05-19T06-50-09Z'
          curl -fsSL --connect-timeout 15 --max-time 300 -A 'RipoTeam-May2022-RecNetCore/1.0' "$base/GameAssembly.dll" -o GameAssembly.dll
          curl -fsSL --connect-timeout 15 --max-time 300 -A 'RipoTeam-May2022-RecNetCore/1.0' "$base/RecRoom_Data/il2cpp_data/Metadata/global-metadata.dat" -o global-metadata.dat
          test "$(sha256sum GameAssembly.dll | cut -d' ' -f1)" = '2ba4571be2791602386bf02581805e021568ccfeacce6cd265450974b7ea8f27'
          test "$(sha256sum global-metadata.dat | cut -d' ' -f1)" = 'd77f3728ba1f3765941f90de036f6b283301c156db3d7e31932e56c9b06a9b0c'

      - name: Run Il2CppDumper
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 120 'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip' -o dumper.zip
          mkdir dumper out
          unzip -q dumper.zip -d dumper
          dll="$(find dumper -type f -name 'Il2CppDumper.dll' | head -1)"
          set +e
          dotnet "$dll" "$PWD/GameAssembly.dll" "$PWD/global-metadata.dat" "$PWD/out" >il2cppdumper.log 2>&1
          set -e
          test -s out/dump.cs

      - name: Extract exact RecNet core and PIPCAIJJNLK disassembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          lines=Path('out/dump.cs').read_text(errors='replace').splitlines()
          chunks=[]

          def capture_index(i, before, after, label):
              lo=max(0,i-before); hi=min(len(lines),i+after)
              chunks.append(f'===== {label} dump.cs lines {lo+1}-{hi} =====')
              chunks.extend(f'{j+1}: {lines[j]}' for j in range(lo,hi))

          def find_contains(text):
              return next((i for i,line in enumerate(lines) if text in line), -1)

          # Grab the method directly first; this cannot depend on the class visibility keyword.
          method_line=find_contains('PIPCAIJJNLK')
          if method_line >= 0:
              capture_index(method_line, 140, 260, 'PIPCAIJJNLK METHOD CONTEXT')
          else:
              chunks.append('===== PIPCAIJJNLK NOT FOUND =====')

          # Locate the top-level class with a visibility-agnostic pattern.
          fg=-1
          class_re=re.compile(r'\bclass\s+FGCLJJMGLAI\b')
          for i,line in enumerate(lines):
              if class_re.search(line) and '.' not in line.split('class',1)[1].split('//',1)[0]:
                  fg=i; break
          if fg >= 0:
              capture_index(fg, 20, 1050, 'FGCLJJMGLAI CORE')
          else:
              chunks.append('===== TOP-LEVEL FGCLJJMGLAI CLASS NOT FOUND =====')

          for text,label,before,after in [
              ('enum KHJPLDAEBPP','SERVICE ENUM KHJPLDAEBPP',20,180),
              ('class JMAANPPEBJE','BESTHTTP REQUEST JMAANPPEBJE',20,260),
              ('class DCHGFBHPDAP','RESPONSE DCHGFBHPDAP',20,240),
          ]:
              i=find_contains(text)
              if i >= 0: capture_index(i,before,after,label)
              else: chunks.append(f'===== {label} NOT FOUND =====')

          rva=None
          if method_line >= 0:
              for k in range(max(0,method_line-8), method_line+1):
                  m=re.search(r'RVA:\s*0x([0-9A-Fa-f]+)', lines[k])
                  if m:
                      rva=int(m.group(1),16)
          chunks.append(f'PIPCAIJJNLK_LINE={method_line+1 if method_line >= 0 else None}')
          chunks.append(f'PIPCAIJJNLK_RVA={hex(rva) if rva is not None else None}')
          Path('recnet-core.txt').write_text('\n'.join(chunks),encoding='utf-8')

          if rva is not None:
              start=max(0,rva-0x100); stop=rva+0x1200
              p=subprocess.run(['objdump','-d','-Mintel',f'--start-address=0x{start:x}',f'--stop-address=0x{stop:x}','GameAssembly.dll'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              Path('pipcaijjnlk-disasm.txt').write_text(p.stdout,encoding='utf-8')
          else:
              Path('pipcaijjnlk-disasm.txt').write_text('RVA not found\n')

          # Metadata contains managed string literals; dump contexts around all relevant names.
          metadata=Path('global-metadata.dat').read_bytes()
          needles=[b'https://ns.rec.net/?v=2', b'NameServerResponse', b'ConnectToRecNet', b'RecNetStatus']
          rows=[]
          for needle in needles:
              start=0
              while True:
                  pos=metadata.find(needle,start)
                  if pos < 0: break
                  lo=max(0,pos-160); hi=min(len(metadata),pos+len(needle)+320)
                  chunk=metadata[lo:hi]
                  printable=''.join(chr(b) if 32 <= b < 127 else '.' for b in chunk)
                  rows.append(f'{needle!r} at 0x{pos:x}: {printable}')
                  start=pos+1
          Path('recnet-metadata-context.txt').write_text('\n'.join(rows),encoding='utf-8')
          print('\n'.join(chunks[:1600]))
          PY

      - name: Upload RecNet bootstrap core
        uses: actions/upload-artifact@v4
        with:
          name: may2022-recnet-bootstrap-core
          path: |
            recnet-core.txt
            pipcaijjnlk-disasm.txt
            recnet-metadata-context.txt
            il2cppdumper.log
          retention-days: 3
